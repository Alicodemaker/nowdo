<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Keep in sync with --color-bg in src/theme.css (light and dark) -->
    <meta name="theme-color" content="#f6f3fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1230" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Do Now: one tiny step, one tap to start." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Do Now</title>
  </head>
  <body>
    <!-- Sample Now screen from kickoff (style reference). Replaced during the v1 build. -->
    <main class="now">
      <header class="now-top">
        <button class="project-chip" type="button" aria-label="Switch project. Current: Do my taxes">
          <span>Do my taxes</span>
          <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <p class="today"><strong>3</strong> steps today</p>
      </header>

      <section class="now-step" aria-labelledby="step-text">
        <p class="step-count">Step 2 of 5</p>
        <h1 class="step-text" id="step-text">Log in to skat.dk with MitID</h1>
        <div class="step-actions">
          <button class="quiet" type="button">Make it smaller</button>
          <button class="quiet" type="button">Not now</button>
        </div>
      </section>

      <div class="start-zone">
        <div class="start-ring">
          <button class="start" type="button" aria-describedby="start-hint">Start</button>
        </div>
        <p class="start-hint" id="start-hint" aria-live="polite">Just 2 minutes.</p>
      </div>

      <div class="now-bottom">
        <button class="capture" type="button" aria-label="Add a step to Loose ends">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
        <button class="done" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Done
        </button>
      </div>
    </main>

    <nav class="tabbar" aria-label="Main">
      <a class="tab" href="#now" aria-current="page">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>
        Now
      </a>
      <a class="tab" href="#projects">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"><path d="M5 7h14M5 12h14M5 17h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Projects
      </a>
    </nav>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
